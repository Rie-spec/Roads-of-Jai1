name: Bootstrap Roads-of-Jai1

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  copy-source-repository:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Copy Roads-of-Jai
        run: |
          git clone --depth 1 https://github.com/Rie-spec/Roads-of-Jai.git /tmp/roads-of-jai
          rsync -a --delete --exclude='.git/' /tmp/roads-of-jai/ ./

      - name: Commit copied repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: copy Roads-of-Jai into test repository"
          git push origin HEAD:main
